<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="TIDELINE — Delta Kings: a 3D open-world crime game in a dusk river-delta canal city. Steal cars, sail boats, run 10 story missions and 2 heists.">
<title>TIDELINE — Delta Kings</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2f66; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; z-index: 5; }
  #hud-top { position: absolute; top: 12px; right: 16px; text-align: right; text-shadow: 0 1px 3px #000; }
  #hud-stars { font-size: 26px; letter-spacing: 2px; line-height: 1; }
  #hud-stars .star { color: rgba(255,255,255,0.25); }
  #hud-stars .star.on { color: #ffd23c; }
  #hud-cash { font-size: 26px; font-weight: 800; color: #7dff8a; margin-top: 2px; }
  #hud-rank { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: #ffd9a0; }
  #hud-health { position: absolute; top: 14px; left: 16px; width: 220px; height: 16px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.4); }
  #hud-health-bar { height: 100%; background: linear-gradient(90deg, #37d67a, #7dff8a); width: 100%; }
  #hud-health-num { position: absolute; left: 228px; top: -2px; font-size: 14px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  #hud-objective { position: absolute; top: 44px; left: 16px; font-size: 15px; font-weight: 600; text-shadow: 0 1px 3px #000; max-width: 520px; }
  #hud-trial { position: absolute; top: 72px; left: 16px; font-size: 15px; font-weight: 700; color: #ff8c42; text-shadow: 0 1px 3px #000; }
  #hud-radio { position: absolute; bottom: 16px; left: 16px; font-size: 14px; letter-spacing: 1px; text-shadow: 0 1px 3px #000; }
  #hud-district { position: absolute; bottom: 16px; right: 16px; font-size: 20px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 1px 4px #000; }
  #hud-hint { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); font-size: 15px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  #hud-toast { position: absolute; top: 110px; left: 50%; transform: translateX(-50%); font-size: 17px; font-weight: 700; color: #ffe14d; text-shadow: 0 1px 4px #000; text-align: center; }
  #minimap { position: absolute; right: 16px; bottom: 48px; border: 2px solid rgba(255,255,255,0.55); border-radius: 50%; background: rgba(10,14,26,0.8); }
  #start-screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #1d2f66 0%, #7a3a6e 55%, #ff8c42 100%); color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; }
  #start-screen h1 { font-size: 72px; margin: 0; letter-spacing: 10px; text-shadow: 0 4px 24px rgba(0,0,0,0.5); }
  #start-screen h2 { font-size: 26px; margin: 4px 0 18px; letter-spacing: 6px; color: #ffd9a0; }
  #start-screen p { font-size: 17px; margin: 6px 0; max-width: 640px; }
  #start-screen .controls { font-size: 14px; color: #ffe9c9; }
  #start-btn { margin-top: 22px; font-size: 22px; font-weight: 800; letter-spacing: 3px; padding: 14px 42px; border: none; border-radius: 6px; background: #ff8c42; color: #1d1430; cursor: pointer; }
  #heist-plan { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 11; background: rgba(12,16,30,0.95); border: 2px solid #ff8c42; border-radius: 8px; padding: 22px 28px; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; pointer-events: auto; }
  #heist-plan h2 { margin: 0 0 8px; color: #ffd9a0; }
  #heist-plan button { margin: 8px 6px 0; font-size: 16px; font-weight: 700; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; }
  #plan-loud { background: #ff5a4e; color: #fff; }
  #plan-quiet { background: #2fae7d; color: #fff; }
  #plan-cancel { background: #555; color: #fff; }
  #selftest { position: fixed; left: 0; top: 0; z-index: 20; background: rgba(0,0,0,0.85); color: #7dff8a; font-size: 11px; max-height: 90vh; overflow: auto; }
</style>
</head>
<body>
<noscript><p style="color:#fff;font-family:sans-serif;padding:2em">TIDELINE needs JavaScript: it is a 3D game that runs entirely in your browser.</p></noscript>
<canvas id="game" aria-label="TIDELINE Delta Kings: drive, sail and pull jobs across a dusk river-delta city"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
